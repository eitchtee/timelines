# Keeps the .po files in sync with the strings in the code.
#
# This is a no-op until app/locale/ contains at least one locale directory:
# `makemessages --all` only refreshes catalogues that already exist. Create the
# first one by hand:
#
#     cd app && uv run python manage.py makemessages --locale pt_BR
#
# The default GITHUB_TOKEN is enough to push the result back. Commits carry
# [skip ci] so they don't re-trigger this workflow.

name: Django Translation Update

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for running'
        required: false
        default: 'Manual update of translation files'

concurrency:
  group: django-translations
  cancel-in-progress: false

jobs:
  update-translations:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # uv reads requires-python from pyproject.toml and fetches that
      # interpreter itself, so there is no setup-python step to keep in sync.
      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Install gettext
        run: sudo apt-get update && sudo apt-get install -y gettext

      - name: Run makemessages
        working-directory: app
        env:
          # makemessages skips system checks, but the settings module is still
          # imported -- these keep it from tripping over unset variables.
          SECRET_KEY: workflow
          SQL_DATABASE: workflow
        run: uv run python manage.py makemessages --all

      - name: Check for changes
        id: check_changes
        run: |
          if git diff --exit-code --quiet app/locale/; then
            echo "No translation changes detected"
          else
            echo "changes_detected=true" >> $GITHUB_OUTPUT
            echo "Translation changes detected"
          fi

      - name: Commit translation files
        if: steps.check_changes.outputs.changes_detected == 'true'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: |
            chore(locale): update translation files

            [skip ci] Automatically generated by the makemessages workflow
          file_pattern: "app/locale/**/*.po"
