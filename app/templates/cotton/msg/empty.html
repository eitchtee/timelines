<div class="flex flex-col items-center text-center {% if not remove_padding %}py-12{% else %}py-6{% endif %}">
  <i class="{% if icon %}{{ icon }}{% else %}fa-regular fa-folder-open{% endif %} text-2xl text-muted-foreground/50"></i>
  <p class="mt-3 font-semibold">{{ title }}</p>
  {% if subtitle %}<p class="mt-1 text-sm text-muted-foreground max-w-sm">{{ subtitle }}</p>{% endif %}
</div>
