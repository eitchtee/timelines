volumes:
  postgres_data: {}

services:
  web:
    build:
      context: .
      dockerfile: ./docker/dev/django/Dockerfile
    image: timelines_dev_server
    container_name: timelines_dev_server
    volumes:
      # Bind-mounted so runserver picks up edits without a rebuild.
      - ./app/:/usr/src/app/:z
      - ./frontend/:/usr/src/frontend:z
    ports:
      - "${OUTBOUND_PORT:-8000}:${INTERNAL_PORT:-8000}"
    env_file:
      - .env
    depends_on:
      - db
      - node
    restart: unless-stopped

  node:
    build:
      context: .
      dockerfile: ./docker/dev/vite/Dockerfile
    image: timelines_dev_node
    container_name: timelines_dev_node
    volumes:
      - ./frontend/:/usr/src/frontend
      - ./app/:/usr/src/app/
      # Anonymous volume keeps the container's node_modules from being shadowed
      # by the host bind mount.
      - /usr/src/frontend/node_modules
    ports:
      - "${VITE_OUTBOUND_PORT:-5173}:5173"
    environment:
      - VITE_DEV_SERVER_HOST=${DJANGO_VITE_DEV_SERVER_HOST:-node}
      - VITE_DEV_SERVER_PORT=5173
    restart: unless-stopped

  db:
    image: postgres:17-bookworm
    container_name: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_USER=${SQL_USER}
      - POSTGRES_PASSWORD=${SQL_PASSWORD}
      - POSTGRES_DB=${SQL_DATABASE}
    ports:
      - "${SQL_PORT:-5432}:5432"
    restart: unless-stopped
